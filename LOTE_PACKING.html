:root{--bg:#f4f3f1;--card:#ffffff;--fg:#1f1b1a;--mut:#6d6663;--line:#e4e0dc;--acc:#c8102e;--chip:#efecea;

:root[data-theme="dark"]{--bg:#141112;--card:#1e1a1b;--fg:#f2ece9;--mut:#a89f9b;--line:#332c2d;--acc:#ff5a6e;--chip:#2a2425;--track:#2c2627;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ff)}
.w{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;color:#fff;border-radius:14px;
  padding:16px 26px;background:linear-gradient(100deg,#c8102e 0%,#a3112a 45%,#5e0d18 100%);box-shadow:0 6px 18px rgba(94,13,24,.25)}
.brand{display:flex;align-items:center;gap:12px} .wm{font:700 2rem/1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}
.tg{font:italic 600 .8rem Georgia,serif;text-align:right;opacity:.95} .uva{width:42px;height:52px}
.ttl{text-align:center;min-width:0} .ttl h1{margin:0;font-family:var(--ff);font-weight:800;font-size:clamp(1.2rem,2.6vw,1.9rem);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.ttl p{margin:4px 0 0;opacity:.9;font-size:.9rem}
.upd{text-align:right} .upd span{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.upd b{display:block;font-size:1.35rem;font-weight:800} .upd small{font-size:.75rem;opacity:.85}

.filt{display:flex;flex-wrap:wrap;gap:10px 22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.fg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.fg>span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-right:4px}
.sel{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut)}
.sel select{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px;padding:5px 8px;font:600 .85rem var(--ff)}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:99px;padding:5px 12px;font:600 .85rem var(--ff);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}

.scroll{overflow-x:auto}
.days{display:flex;align-items:flex-end;gap:8px;height:250px;min-width:max-content;padding-top:20px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;width:52px}
.day .t{font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.day .b{width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden}
.day .b i{display:block}
.day .d{font-size:.7rem;color:var(--mut);white-space:nowrap}
.ley{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.82rem;color:var(--mut)}
.ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tabh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
td .pc{display:block;color:var(--mut);font-size:.75rem;font-weight:500}
td.g{min-width:96px} td.tt{font-size:1rem}
.mb{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--track);min-width:160px}
.mb i{display:block;height:100%}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px;border-bottom:2px solid var(--fg);white-space:nowrap}

td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td small{color:var(--mut);font-size:.72rem;margin-left:4px}
tr.tot td{font-weight:800;border-top:2px solid var(--fg);border-bottom:none}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

  const GC = Object.fromEntries(gs.map((g,i)=>[g,colg(g,i)]));
  document.getElementById('tsub').textContent = VISTAS[vista][1] + ' · ' + MED[med].toLowerCase();
  const head = `<thead><tr><th>Lote</th><th>Variedad</th><th>Total</th>${gs.map(g=>`<th>${vista==='cb'?'Calibre '+g:g}</th>`).join('')}<th style="text-align:left">Reparto</th></tr></thead>`;
  const fila = (lab, va, rr, cls='') => { const t = sum(rr,med), o = by(rr,vista,med);
    return `<tr class="${cls}"><td><b>${lab}</b></td><td>${va}</td><td class="tt"><b>${fmt(t)}</b></td>`
      + gs.map(g => `<td class="g">${o[g] ? `<b>${fmt(o[g])}</b><span class="pc">${(o[g]/t*100).toFixed(1)}%</span>` : '—'}</td>`).join('')
      + `<td><div class="mb">${gs.filter(g=>o[g]).map(g=>`<i title="${g}: ${(o[g]/t*100).toFixed(1)}%" style="width:${(o[g]/t*100).toFixed(2)}%;background:${GC[g]}"></i>`).join('')}</div></td></tr>`; };
  const lsort = lts.slice().sort((a,b) => sum(rows.filter(r=>r.lt===b),med) - sum(rows.filter(r=>r.lt===a),med));
  document.getElementById('tab').innerHTML = head + '<tbody>' + lsort.map(l => { const rr = rows.filter(r=>r.lt===l); return fila(l, [...new Set(rr.map(r=>r.va))].join(', '), rr); }).join('') + fila('Total','',rows,'tot') + '</tbody>';
  document.getElementById('ltab').innerHTML = gs.map(g=>`<span><i style="background:${GC[g]}"></i>${vista==='cb'?'Calibre '+g:g}</span>`).join('');
  // repartos
  const rep = (tit, key, colf) => { const o = by(rows,key,med), e = Object.entries(o).sort((a,b)=>b[1]-a[1]), m = Math.max(1,...e.map(x=>x[1]));
    return `<div class="card"><h2>${tit}</h2><p class="sub">${MED[med]}</p>${e.map(([n,v],i)=>`<div class="rp"><span class="n">${n}</span><div class="bar"><i style="width:${(v/m*100).toFixed(1)}%;background:${colf(n,i)}"></i></div><span class="v">${fmt(v)}</span><span class="p">${(v/(tot||1)*100).toFixed(0)}%</span></div>`).join('')}</div>`; };
  document.getElementById('rep').innerHTML = rep('Por calibre','cb',(n,i)=>PAL[(i+3)%PAL.length]) + rep('Por categoría','ca',n=>CAT[n]||'#9a9290') + rep('Por presentación','pr',(n,i)=>PAL[(i+5)%PAL.length]);
}
document.getElementById('nota').textContent = 'Fuente: diario de calidad de packing (fecha de producción). Las cajas de lotes mezclados (código AZ) vienen repetidas en dos lotes y se reparten mitad y mitad. "Ensayos" son lotes de prueba que no están en el mapa (Lote 282, variedades FN y RR).';
{ const n = new Date(); document.getElementById('gen').textContent = 'reporte del 23/11/2026'; }
draw();
</script>
